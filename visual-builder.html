<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteCommand Visual Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f9;color:#142b49;font:15px Arial}header{padding:16px;background:white;display:flex;gap:10px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:16px}aside,article{background:white;border-radius:14px;padding:16px;min-width:0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;max-width:100%;padding:10px;border:1px solid #bacbe0;border-radius:8px}input:not([type=checkbox]),textarea,select{width:100%}button{background:#173b67;color:white;cursor:pointer;margin:3px}fieldset{border:1px solid #d6e0ed;border-radius:10px;margin:12px 0;min-width:0}iframe{display:block;border:1px solid #d6e0ed;height:75vh;max-width:100%;margin:auto;background:white}#status{padding:12px} @media(max-width:800px){main{grid-template-columns:1fr;padding:10px}iframe{height:65vh}header{position:sticky;top:0;z-index:2}}</style></head><body><header><a href="siteeditor.html">← Website editor</a><strong>Visual Builder · Test workspace</strong><button id="save">Save local draft</button><button id="snapshot">Save version</button><button id="restore">Restore version</button><button id="export">Export preview HTML</button></header><div id="status" role="status">Prototype: changes are stored only on this device; live websites are not changed.</div><main><aside id="controls"></aside><article><div id="devices"><button data-width="100%">Desktop</button><button data-width="768px">Tablet</button><button data-width="390px">Mobile</button></div><iframe title="Draft preview" sandbox id="preview" style="width:100%"></iframe></article></main><script type="module">
import {defaults,normalize,move,duplicate,render} from './visual-builder-model.mjs';
const $=id=>document.getElementById(id),key='sc-builder-prototype-v2';let model=defaults(),page='home';try{model=normalize(JSON.parse(localStorage.getItem(key))||model)}catch{}
const status=t=>$('status').textContent=t;const preview=()=>{$('preview').srcdoc=render(model,page)};const uid=()=>crypto.randomUUID();const el=(tag,text,parent)=>{const n=document.createElement(tag);if(text)n.textContent=text;parent?.append(n);return n};const button=(p,t,fn)=>{const b=el('button',t,p);b.onclick=fn;return b};const field=(p,t,value,fn,type='text')=>{const l=el('label',t,p),n=el(type==='textarea'?'textarea':'input','',l);if(type!=='textarea')n.type=type;if(type==='checkbox')n.checked=value;else n.value=value||'';n.oninput=()=>{fn(type==='checkbox'?n.checked:n.value);preview()};return n};const select=(p,t,values,value,fn)=>{const l=el('label',t,p),n=el('select','',l);for(const [v,label] of values){const o=el('option',label,n);o.value=v}n.value=value;n.onchange=()=>fn(n.value);return n};
function draw(){const root=$('controls');root.replaceChildren();const p=model.pages.find(x=>x.slug===page)||model.pages[0];page=p.slug;el('h2','Pages & navigation',root);select(root,'Edit page',model.pages.map(x=>[x.slug,x.title]),page,v=>{page=v;draw()});field(root,'Page title',p.title,v=>p.title=v);field(root,'Show in navigation',p.nav,v=>p.nav=v,'checkbox');button(root,'Add page',()=>{if(model.pages.length>=20)return status('Maximum 20 pages');const title=prompt('Page title');if(!title)return;const slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);if(!slug||model.pages.some(x=>x.slug===slug))return status('Choose a unique page title');model.pages.push({slug,title,nav:true,sections:[]});page=slug;draw()});if(page!=='home')button(root,'Delete page',()=>{if(confirm('Delete this page?')){model.pages=model.pages.filter(x=>x.slug!==page);page='home';draw()}});button(root,'Move navigation earlier',()=>{model.pages=move(model.pages,model.pages.indexOf(p),model.pages.indexOf(p)-1);draw()});button(root,'Move navigation later',()=>{model.pages=move(model.pages,model.pages.indexOf(p),model.pages.indexOf(p)+1);draw()});
el('h2','Design',root);select(root,'Font',['Arial','Georgia','Verdana','Tahoma','Trebuchet MS'].map(x=>[x,x]),model.theme.font,v=>{model.theme.font=v;preview()});for(const [k,t] of [['color','Text color'],['background','Background'],['button','Button color']])field(root,t,model.theme[k],v=>model.theme[k]=v,'color');
el('h2','Sections',root);let kind='text';select(root,'Section type',['hero','services','text','image','contact'].map(x=>[x,x]),kind,v=>kind=v);button(root,'Add section',()=>{if(p.sections.length>=50)return status('Maximum 50 sections');p.sections.push({id:uid(),type:kind,title:'New '+kind,body:'',photo:'',hidden:false});draw()});p.sections.forEach((s,i)=>{const f=el('fieldset','',root);el('legend',s.type+' · '+(i+1),f);f.draggable=true;f.ondragstart=e=>e.dataTransfer.setData('application/x-sc-section',String(i));f.ondragover=e=>e.preventDefault();f.ondrop=e=>{e.preventDefault();const v=e.dataTransfer.getData('application/x-sc-section');if(v!==''){p.sections=move(p.sections,Number(v),i);draw()}};field(f,'Heading',s.title,v=>s.title=v);field(f,'Content',s.body,v=>s.body=v,'textarea');field(f,'Photo HTTPS URL',s.photo,v=>s.photo=v);field(f,'Hide section',s.hidden,v=>s.hidden=v,'checkbox');button(f,'↑',()=>{p.sections=move(p.sections,i,i-1);draw()});button(f,'↓',()=>{p.sections=move(p.sections,i,i+1);draw()});button(f,'Duplicate',()=>{if(p.sections.length<50){p.sections.splice(i+1,0,duplicate(s,uid()));draw()}});button(f,'Remove',()=>{p.sections.splice(i,1);draw()})});
el('h2','Services',root);button(root,'Add service',()=>{if(model.services.length<50){model.services.push({title:'New service',body:'',photo:''});draw()}});model.services.forEach((s,i)=>{const f=el('fieldset','',root);field(f,'Name',s.title,v=>s.title=v);field(f,'Description',s.body,v=>s.body=v,'textarea');field(f,'Photo HTTPS URL',s.photo,v=>s.photo=v);button(f,'Remove',()=>{model.services.splice(i,1);draw()})});preview()}
$('devices').onclick=e=>{if(e.target.dataset.width)$('preview').style.width=e.target.dataset.width};$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(normalize(model)));status('Local draft saved')}catch(e){status(e.message)}};$('snapshot').onclick=()=>{try{localStorage.setItem(key+'-version',JSON.stringify(normalize(model)));status('Local version saved')}catch(e){status(e.message)}};$('restore').onclick=()=>{try{const v=localStorage.getItem(key+'-version');if(v&&confirm('Restore saved local version?')){model=normalize(JSON.parse(v));draw();status('Local version restored')}}catch(e){status(e.message)}};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([render(model,page)],{type:'text/html'}));a.download=page+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};draw();
</script></body></html>
