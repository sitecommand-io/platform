<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteCommand Visual Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f9;color:#142b49;font:15px Arial}header{padding:16px;background:white;display:flex;gap:10px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:16px}aside,article{background:white;border-radius:14px;padding:16px;min-width:0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;max-width:100%;padding:10px;border:1px solid #bacbe0;border-radius:8px}input:not([type=checkbox]),textarea,select{width:100%}button{background:#173b67;color:white;cursor:pointer;margin:3px}fieldset{border:1px solid #d6e0ed;border-radius:10px;margin:12px 0;min-width:0}iframe{display:block;border:1px solid #d6e0ed;height:75vh;max-width:100%;margin:auto;background:white}#status{padding:12px} @media(max-width:800px){main{grid-template-columns:1fr;padding:10px}iframe{height:65vh}header{position:sticky;top:0;z-index:2}}</style><style>
:root{--navy:#142b49;--line:#dce4ef;--muted:#64748b}body{background:#e9eef5;font-family:system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;min-height:66px;padding:12px 20px;border-bottom:1px solid var(--line);box-shadow:0 2px 12px #142b4908}header a{color:var(--navy);text-decoration:none;font-size:13px}header strong{margin-right:auto;font-size:16px}button{font-weight:600;font-size:13px;min-height:40px;background:#fff;color:var(--navy);border:1px solid #cbd7e6}button:hover{background:#eaf1fa}#save,#export{background:#173b67;color:white;border-color:#173b67}#status{font-size:12px;color:var(--muted);background:#f8fafc;border-bottom:1px solid var(--line);padding:8px 20px}main{padding:0;gap:0;grid-template-columns:340px minmax(0,1fr);height:calc(100dvh - 110px)}aside{border-radius:0;border-right:1px solid var(--line);overflow:auto;padding:18px;background:white}article{border-radius:0;background:#e9eef5;padding:16px;overflow:auto}#devices{display:flex;justify-content:center;gap:6px;margin-bottom:14px}#devices button{min-width:82px}iframe{height:calc(100dvh - 190px);border:0;box-shadow:0 8px 32px #142b4920;border-radius:8px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;margin:24px 0 12px;color:#334e70}h2:first-child{margin-top:0}fieldset{padding:12px;background:#f8fafc}legend{font-size:12px;font-weight:700;color:#334e70}label{font-size:12px;font-weight:600;color:#475569}input,textarea,select{margin-top:5px;background:white;color:#142b49;font-size:16px}textarea{min-height:80px}input[type=color]{height:42px;padding:4px}input[type=checkbox]{margin-left:10px} @media(max-width:800px){header{padding:10px;gap:4px}header strong{width:100%;order:-1}header button{flex:1;min-width:110px}main{height:auto;display:flex;flex-direction:column;padding:0}aside{border:0;overflow:visible}article{order:-1;padding:10px}iframe{height:52vh}#devices button{min-width:0;flex:1}#status{padding:8px 12px}}
</style><style>.section-row{padding:4px;margin:5px 0;background:#fff;border:1px solid #dce4ef}.section-heading{display:block;width:100%;text-align:left;border:0;background:#f3f6fb;margin:0;padding:12px;color:#142b49}.section-heading:hover{background:#e1ebfa}.section-row:focus-within{border-color:#7799c5}</style><style>header{display:grid;grid-template-columns:auto 1fr auto auto auto auto auto;gap:8px}header strong{margin:0}#devices{margin:0;align-items:center}main{grid-template-columns:280px minmax(0,1fr)}aside{padding:14px}article{padding:18px}details{margin:12px 0;border-top:1px solid #dce4ef;padding:12px 0}summary{cursor:pointer;font-weight:650;color:#142b49}iframe{height:calc(100dvh - 145px)}@media(max-width:1000px){header{display:flex;flex-wrap:wrap}#devices{order:2;width:100%}header strong{flex:1}}@media(max-width:800px){main{display:flex}iframe{height:52vh}header strong{width:auto;order:0}}</style></head><body><header><a href="siteeditor.html">←</a><strong>SiteCommand Studio</strong><div id="devices"><button data-width="100%">Desktop</button><button data-width="768px">Tablet</button><button data-width="390px">Mobile</button></div><button id="save">Save draft</button><button id="snapshot">Save version</button><button id="restore">Restore version</button><button id="export">Export HTML</button></header><div id="status" role="status">Prototype: changes are stored only on this device; live websites are not changed.</div><main><aside id="controls"></aside><article><iframe title="Draft preview" sandbox id="preview" style="width:100%"></iframe></article></main><script type="module">
import {defaults,normalize,move,duplicate,render} from './visual-builder-model.mjs';
const $=id=>document.getElementById(id),key='sc-builder-prototype-v2';let model=defaults(),page='home',activeSection=null;try{model=normalize(JSON.parse(localStorage.getItem(key))||model)}catch{}
const status=t=>$('status').textContent=t;const preview=()=>{$('preview').srcdoc=render(model,page)};const uid=()=>crypto.randomUUID();const el=(tag,text,parent)=>{const n=document.createElement(tag);if(text)n.textContent=text;parent?.append(n);return n};const button=(p,t,fn)=>{const b=el('button',t,p);b.onclick=fn;return b};const field=(p,t,value,fn,type='text')=>{const l=el('label',t,p),n=el(type==='textarea'?'textarea':'input','',l);if(type!=='textarea')n.type=type;if(type==='checkbox')n.checked=value;else n.value=value||'';n.oninput=()=>{fn(type==='checkbox'?n.checked:n.value);preview()};return n};const select=(p,t,values,value,fn)=>{const l=el('label',t,p),n=el('select','',l);for(const [v,label] of values){const o=el('option',label,n);o.value=v}n.value=value;n.onchange=()=>fn(n.value);return n};
function draw(){const root=$('controls');root.replaceChildren();const p=model.pages.find(x=>x.slug===page)||model.pages[0];page=p.slug;el('h2','Pages & navigation',root);select(root,'Edit page',model.pages.map(x=>[x.slug,x.title]),page,v=>{page=v;draw()});field(root,'Page title',p.title,v=>p.title=v);field(root,'Show in navigation',p.nav,v=>p.nav=v,'checkbox');button(root,'Add page',()=>{if(model.pages.length>=20)return status('Maximum 20 pages');const title=prompt('Page title');if(!title)return;const slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);if(!slug||model.pages.some(x=>x.slug===slug))return status('Choose a unique page title');model.pages.push({slug,title,nav:true,sections:[]});page=slug;draw()});if(page!=='home')button(root,'Delete page',()=>{if(confirm('Delete this page?')){model.pages=model.pages.filter(x=>x.slug!==page);page='home';draw()}});button(root,'Move navigation earlier',()=>{model.pages=move(model.pages,model.pages.indexOf(p),model.pages.indexOf(p)-1);draw()});button(root,'Move navigation later',()=>{model.pages=move(model.pages,model.pages.indexOf(p),model.pages.indexOf(p)+1);draw()});
const themePanel=el('details','',root);el('summary','⚙ Theme settings',themePanel);select(themePanel,'Font',['Arial','Georgia','Verdana','Tahoma','Trebuchet MS'].map(x=>[x,x]),model.theme.font,v=>{model.theme.font=v;preview()});for(const [k,t] of [['color','Text color'],['background','Background'],['button','Button color']])field(themePanel,t,model.theme[k],v=>model.theme[k]=v,'color');
el('h2','Page sections',root);let kind='text';select(root,'Section type',['hero','services','text','image','contact'].map(x=>[x,x]),kind,v=>kind=v);button(root,'Add section',()=>{if(p.sections.length>=50)return status('Maximum 50 sections');const id=uid();p.sections.push({id,type:kind,title:'New '+kind,body:'',photo:'',hidden:false});activeSection=id;draw()});p.sections.forEach((s,i)=>{const f=el('fieldset','',root);f.className='section-row';const head=button(f,'⠿ '+(s.title||s.type)+(s.hidden?' · Hidden':''),()=>{activeSection=activeSection===s.id?null:s.id;draw()});head.className='section-heading';f.draggable=true;f.ondragstart=e=>e.dataTransfer.setData('application/x-sc-section',String(i));f.ondragover=e=>e.preventDefault();f.ondrop=e=>{e.preventDefault();const v=e.dataTransfer.getData('application/x-sc-section');if(v!==''){p.sections=move(p.sections,Number(v),i);draw()}};if(activeSection===s.id){field(f,'Heading',s.title,v=>s.title=v);field(f,'Content',s.body,v=>s.body=v,'textarea');field(f,'Photo HTTPS URL',s.photo,v=>s.photo=v);field(f,'Hide section',s.hidden,v=>s.hidden=v,'checkbox');button(f,'↑',()=>{p.sections=move(p.sections,i,i-1);draw()});button(f,'↓',()=>{p.sections=move(p.sections,i,i+1);draw()});button(f,'Duplicate',()=>{if(p.sections.length<50){p.sections.splice(i+1,0,duplicate(s,uid()));draw()}});button(f,'Remove',()=>{p.sections.splice(i,1);activeSection=null;draw()})}});
const servicePanel=el('details','',root);el('summary','Service content',servicePanel);button(servicePanel,'Add service',()=>{if(model.services.length<50){model.services.push({title:'New service',body:'',photo:''});draw()}});model.services.forEach((s,i)=>{const f=el('fieldset','',servicePanel);field(f,'Name',s.title,v=>s.title=v);field(f,'Description',s.body,v=>s.body=v,'textarea');field(f,'Photo HTTPS URL',s.photo,v=>s.photo=v);button(f,'Remove',()=>{model.services.splice(i,1);draw()})});preview()}
$('devices').onclick=e=>{if(e.target.dataset.width)$('preview').style.width=e.target.dataset.width};$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(normalize(model)));status('Local draft saved')}catch(e){status(e.message)}};$('snapshot').onclick=()=>{try{localStorage.setItem(key+'-version',JSON.stringify(normalize(model)));status('Local version saved')}catch(e){status(e.message)}};$('restore').onclick=()=>{try{const v=localStorage.getItem(key+'-version');if(v&&confirm('Restore saved local version?')){model=normalize(JSON.parse(v));draw();status('Local version restored')}}catch(e){status(e.message)}};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([render(model,page)],{type:'text/html'}));a.download=page+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};draw();
</script></body></html>
