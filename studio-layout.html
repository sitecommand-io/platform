<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteCommand Studio — Layout preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#142b45;background:#e8edf3}header{height:clamp(76px,11vw,128px);background:white;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 3%;border-bottom:3px solid #e8edf3}header strong{font-size:clamp(18px,2.6vw,36px)}button,select{font:inherit;color:inherit;border:0;border-radius:12px;padding:14px;cursor:pointer}header select{justify-self:center;background:#eaf0f5;width:clamp(110px,18vw,240px);text-align:center;font-size:clamp(15px,2vw,27px)}header button{justify-self:end;background:#17385e;color:white;font-size:clamp(16px,2.2vw,30px);padding:16px 30px}main{display:grid;grid-template-columns:29% minmax(0,1fr);min-height:calc(100dvh - 128px)}aside{background:white;padding:24px 5%;display:flex;flex-direction:column;gap:8px}aside h1{font-size:clamp(20px,2.5vw,34px);margin:0 0 20px}aside p{font-size:clamp(13px,1.9vw,25px);color:#647487;margin:0 0 12px}.section{display:flex;align-items:center;gap:14px;text-align:left;background:#f4f6f9;font-size:clamp(14px,1.7vw,23px);padding:clamp(12px,1.6vw,22px) 16px;width:100%}.section.active{background:#dfe9f8}.extra{background:transparent;text-align:left;font-size:clamp(14px,1.7vw,23px);margin-top:24px;color:#285b91}.theme{color:#142b45;margin-top:auto}article{padding:3.5%;min-width:0;overflow:auto}.site{background:white;border-radius:16px 16px 0 0;overflow:hidden;margin:auto;width:100%;transition:width .2s}.sitehead{display:flex;align-items:center;justify-content:space-between;padding:3.2% 4.3%;gap:12px}.sitehead strong{font-size:clamp(15px,2vw,28px)}nav{font-size:clamp(10px,1.4vw,19px)}.hero{background:#223b53;color:white;display:grid;grid-template-columns:1fr 1fr;align-items:center;min-height:clamp(200px,26vw,355px);padding-left:4.3%;overflow:hidden}.hero h2{font-size:clamp(26px,3.8vw,52px);line-height:1.18;margin:0 0 28px}.hero button{background:white;font-size:clamp(12px,1.6vw,22px);padding:16px 30px;border-radius:7px}.hero svg{width:100%;align-self:end;display:block}.services{padding:3.6% 4.3% 4%;text-align:center;position:relative}.services h2{font-size:clamp(24px,3vw,40px);margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:4.5%}.cards svg{width:100%;display:block;border-radius:12px;background:#d2dee8}.cards p{font-size:clamp(14px,2vw,27px);margin:22px 0 0}.selected{outline:4px solid #478bd7;outline-offset:-4px}footer{text-align:center;background:#142b45;color:white;padding:3%;font-size:clamp(16px,2vw,27px)}.note{font-size:12px;color:#647487;margin:12px 0}.site.narrow .hero{grid-template-columns:1fr;padding:24px}.site.narrow .cards{grid-template-columns:1fr;gap:20px}.site.narrow .sitehead{flex-wrap:wrap}@media(max-width:650px){header{padding:10px;gap:8px}header button{padding:12px}main{grid-template-columns:1fr}article{grid-row:1;padding:12px}aside{padding:16px}.theme{margin-top:12px}}
dialog{border:1px solid #d2dee8;border-radius:14px;padding:24px;width:min(440px,90vw);color:#142b45}dialog label{display:block;margin:12px 0}dialog input,dialog textarea,dialog select{display:block;width:100%;padding:10px;border:1px solid #b9c8d7;border-radius:6px;font:inherit}dialog button{margin:6px;background:#e8edf3}aside h1 select{background:white;width:100%;padding:0;font-weight:bold}.custom{padding:30px;text-align:center}.note{overflow-wrap:anywhere}</style></head><body><header><strong>SiteCommand Studio</strong><select id="device" aria-label="Preview device"><option value="100%">Desktop</option><option value="768px">Tablet</option><option value="390px">Mobile</option></select><button id="publish" title="Export a local website preview">Export</button></header><main><aside><h1><select id="page" aria-label="Page"><option>Home page</option></select></h1><p>PAGE SECTIONS</p><div id="sections"></div><button class="extra" id="add">＋ Add section</button><button class="extra theme" id="theme">⚙ Theme settings</button></aside><article><div class="site" id="site"><div class="sitehead" data-section="Header"><strong>YOUR COMPANY</strong><nav>HOME SERVICES CONTACT</nav></div><div class="hero" data-section="Slideshow"><div><h2>Built with<br>excellence.</h2><button id="estimate">FREE ESTIMATE</button></div><svg viewBox="0 0 450 350" aria-label="House illustration"><path d="M55 165L220 35L420 165V350H55Z" fill="#73889c"/><path d="M20 170L220 20L445 170" fill="none" stroke="#afbfcd" stroke-width="18"/><rect x="140" y="185" width="72" height="165" fill="#3c5064"/><rect x="270" y="173" width="100" height="80" fill="#c4d4e2"/></svg></div><div class="services selected" data-section="Services"><h2>Our Services</h2><div class="cards" id="cards"></div></div><footer data-section="Footer">Let's build something exceptional.</footer></div><p class="note">Layout preview only — no live website or saved draft changes.</p></article></main><dialog id="editor"><form id="editform"><h2 id="dialogtitle"></h2><div id="fields"></div><button type="submit">Apply</button><button type="button" id="cancel">Cancel</button></form></dialog><script>const names=['Header','Slideshow','Services','Project gallery','About us','Reviews','Contact form','Footer'];const sections=document.getElementById('sections');for(const name of names){const b=document.createElement('button');b.className='section'+(name==='Services'?' active':'');b.style.marginBottom='8px';b.textContent='⠿  '+name;b.onclick=()=>{document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('selected',x.dataset.section===name))};sections.append(b)}for(const name of ['Roofing','Siding','Renovation']){const card=document.createElement('div');card.innerHTML='<svg viewBox="0 0 250 135" aria-hidden="true"><path d="M20 95L115 18L230 95" stroke="#748a9d" stroke-width="11" fill="none"/></svg><p>'+name+'</p>';document.getElementById('cards').append(card)}document.getElementById('device').onchange=e=>{const s=document.getElementById('site');s.style.width=e.target.value;s.style.maxWidth='100%';s.classList.toggle('narrow',e.target.value==='390px')};const by=id=>document.getElementById(id),site=by('site'),dialog=by('editor'),fields=by('fields');let apply=()=>{};function edit(title,items,fn){by('dialogtitle').textContent=title;fields.replaceChildren();const inputs={};for(const [key,label,value,type] of items){const l=document.createElement('label');l.textContent=label;const n=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')n.type=type||'text';n.value=value;l.append(n);fields.append(l);inputs[key]=n}apply=()=>fn(Object.fromEntries(Object.entries(inputs).map(([k,n])=>[k,n.value])));dialog.showModal()}by('editform').onsubmit=e=>{e.preventDefault();apply();dialog.close()};by('cancel').onclick=()=>dialog.close();function addSection(name,heading,body){const n=document.createElement('section');n.className='custom';n.dataset.section=name;const h=document.createElement('h2'),p=document.createElement('p');h.textContent=heading;p.textContent=body;n.append(h,p);site.insertBefore(n,site.querySelector('footer'));return n}function bindRow(b,name){b.onclick=()=>{document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x===b));let n=[...site.querySelectorAll('[data-section]')].find(x=>x.dataset.section===name);if(!n)n=addSection(name,name,'');site.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('selected',x===n));n.scrollIntoView({block:'nearest'});edit(name,[['heading','Heading',n.querySelector('h2,strong')?.textContent||n.textContent.trim(),'text'],['body','Additional text',n.querySelector('p.editbody')?.textContent||'','textarea']],v=>{const h=n.querySelector('h2,strong');if(h)h.textContent=v.heading;else if(name==='Footer')n.textContent=v.heading;let p=n.querySelector('p.editbody');if(!p){p=document.createElement('p');p.className='editbody';n.append(p)}p.textContent=v.body})}}[...sections.children].forEach((b,i)=>bindRow(b,names[i]));by('add').onclick=()=>edit('Add section',[['name','Section name','','text'],['body','Content','','textarea']],v=>{if(!v.name.trim()||names.includes(v.name.trim()))return;const name=v.name.trim();names.push(name);addSection(name,name,v.body);const b=document.createElement('button');b.className='section';b.textContent='⠿  '+name;b.style.marginBottom='8px';sections.append(b);bindRow(b,name)});by('theme').onclick=()=>edit('Theme settings',[['color','Text color','#142b45','color'],['background','Website background','#ffffff','color'],['hero','Hero background','#223b53','color'],['font','Font family','Arial','text']],v=>{site.style.color=v.color;site.style.background=v.background;site.style.fontFamily=v.font;site.querySelector('.hero').style.background=v.hero});by('estimate').onclick=()=>edit('Estimate form preview',[['name','Name','','text'],['email','Email','','email'],['message','Project details','','textarea']],()=>{document.querySelector('.note').textContent='Estimate preview completed. No message was sent.'});by('publish').onclick=()=>{const clone=site.cloneNode(true);clone.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));clone.querySelectorAll('button').forEach(n=>n.disabled=true);const css=document.querySelector('style').textContent;const blob=new Blob(['<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>'+css+'</style>'+clone.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='website-preview.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const page=by('page');const add=document.createElement('option');add.value='new';add.textContent='＋ Add page';page.append(add);let current='Home page';const drafts=new Map();function savePage(){drafts.set(current,{html:site.innerHTML,names:[...names]})}function switchPage(name){savePage();current=name;const d=drafts.get(name);if(d){site.innerHTML=d.html;names.splice(0,names.length,...d.names)}else{site.replaceChildren();names.splice(0,names.length);addSection(name,name,'');names.push(name)}sections.replaceChildren();for(const n of names){const b=document.createElement('button');b.className='section';b.textContent='⠿  '+n;b.style.marginBottom='8px';sections.append(b);bindRow(b,n)}const estimate=by('estimate');if(estimate)estimate.onclick=()=>edit('Estimate preview',[['name','Name','','text']],()=>{});page.value=name}page.onchange=()=>{if(page.value!=='new'){switchPage(page.value);return}page.value=current;edit('Add page',[['name','Page name','','text']],v=>{const n=v.name.trim();if(!n||[...page.options].some(o=>o.value===n))return;const o=document.createElement('option');o.value=n;o.textContent=n;page.insertBefore(o,add);switchPage(n)})};</script></body></html>
