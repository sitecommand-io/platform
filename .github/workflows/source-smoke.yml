name: Read-only source smoke tests
on:
  pull_request:
  push:
    branches:
      - 'audit/**'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source smoke checks (no customer data)
        run: node --test tests/*.test.mjs
